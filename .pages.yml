# Pages CMS editor for the public academic website.
media:
- name: images
  label: Images
  input: assets/img
  output: /assets/img
  categories:
  - image
- name: documents
  label: CV PDFs
  input: cv
  output: /cv
  extensions:
  - pdf
content:
- name: profile
  label: Profile and contact
  type: file
  path: _data/profile.yml
  format: yaml
  fields:
  - name: title
    label: Full name
    type: string
    required: true
  - name: name_zh
    label: Name in Chinese
    type: string
  - name: position
    label: Position
    type: string
  - name: affiliation
    label: University or affiliation
    type: string
    required: true
  - name: affiliation_link
    label: University website
    type: string
  - name: avatar
    label: Portrait
    type: image
    options:
      media: images
  - name: email
    label: Primary email
    type: string
  - name: email2
    label: Secondary email
    type: string
  - name: google_scholar
    label: Google Scholar URL
    type: string
  - name: researchgate
    label: ResearchGate URL
    type: string
  - name: orcid
    label: ORCID URL
    type: string
  - name: cv_pdf
    label: CV PDF
    type: file
    description: Select the public copy of the PDF.
    required: true
    options:
      media: documents
      extensions:
      - pdf
  - name: description
    label: Homepage search result description
    type: text
- name: home
  label: Home
  type: file
  path: _data/home.yml
  format: yaml
  fields:
  - name: introduction
    label: Homepage introduction
    type: rich-text
    required: true
    options:
      format: markdown
  - name: distinction
    label: Honor below the university line
    type: string
  - name: interests_intro
    label: Research interests heading
    type: string
    required: true
  - name: research_interests
    label: Homepage research interests
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{fields.title}'
    fields:
    - name: title
      label: Interest
      type: string
      required: true
    - name: detail
      label: Details in parentheses
      type: string
    - name: url
      label: Link URL
      type: string
  - name: news_heading
    label: News heading
    type: string
    required: true
  - name: news_count
    label: Number of news items
    type: number
    required: true
    options:
      min: 1
      step: 1
  - name: news_link_label
    label: Link to the News page
    type: string
    required: true
  - name: featured_heading
    label: Selected publications heading
    type: string
    required: true
  - name: featured_link_label
    label: Link to the Publications page
    type: string
    required: true
- name: bio
  label: Bio
  type: file
  path: _data/bio.yml
  format: yaml
  fields:
  - name: heading
    label: Page heading
    type: string
    required: true
  - name: description
    label: Search result description
    type: text
  - name: body
    label: Biography
    type: rich-text
    required: true
    options:
      format: markdown
  - name: education_heading
    label: Education heading
    type: string
    required: true
  - name: education
    label: Education entries
    type: string
    list: true
- name: research
  label: Research
  type: group
  items:
  - name: research_topics
    label: Topics
    type: collection
    path: _research_topics
    filename:
      template: '{primary}.md'
      field: create
    format: yaml-frontmatter
    subfolders: false
    operations:
      rename: false
    view:
      primary: title
      fields:
      - title
      - order
      sort:
      - order
      - title
      default:
        sort: order
        order: asc
    fields:
    - name: title
      label: Topic name
      type: string
      required: true
    - name: overview
      label: Topic description
      type: rich-text
      required: true
      options:
        format: markdown
    - name: image
      label: Figure
      type: image
      options:
        media: images
    - name: image_alt
      label: Figure description for screen readers
      type: string
    - name: caption
      label: Figure caption
      type: rich-text
      options:
        format: markdown
    - name: related_papers
      label: Related publications
      type: reference
      description: Search and select one or more entries. Linked entries are updated after the site workflow
        runs.
      options:
        collection: papers
        multiple: true
        search: title,year,conference
        value: '{path}'
        label: '{title} ({year}){reference_note}'
    - name: order
      label: Display order
      type: number
      description: Optional. Smaller numbers appear first. Blank entries appear after numbered entries.
      options: &id001
        min: 0
        step: 1
  - name: research_page
    label: Page settings
    type: file
    path: _data/research.yml
    format: yaml
    fields:
    - name: heading
      label: Page heading
      type: string
      required: true
    - name: description
      label: Search result description
      type: text
- name: publications
  label: Publications
  type: group
  items:
  - name: paper_lists
    label: Papers
    type: group
    items:
    - name: papers
      label: All Papers (33)
      type: collection
      path: _papers
      filename: &papers_filename
        template: '{primary}.md'
        field: create
      format: yaml-frontmatter
      subfolders: false
      operations: &papers_operations
        rename: false
      view: &papers_view
        primary: title
        fields:
        - title
        - year
        - conference
        - display_order
        sort:
        - year
        - title
        - display_order
        search:
        - title
        - authors
        - conference
        - year
        default:
          sort: year
          order: desc
      fields: &papers_fields
      - name: title
        label: Paper title
        type: string
        required: true
      - name: reference_note
        label: Reference label note
        type: string
        hidden: true
      - name: authors
        label: Authors
        type: string
        description: Enter author names in publication order, separated by commas.
        required: true
      - name: conference
        label: Journal or conference
        type: string
        required: true
      - name: year
        label: Publication year
        type: number
        required: true
        options:
          step: 1
      - name: author_role
        label: Your author role
        type: select
        required: true
        options:
          values:
          - value: first
            label: First author
          - value: co-first
            label: Co-first author
          - value: coauthor
            label: Non-first author
      - name: publication_type
        label: Publication type
        type: select
        required: true
        options:
          values:
          - value: journal
            label: Journal paper
          - value: conference
            label: Conference paper
      - name: display_order
        label: Display order
        type: number
        description: Lower numbers appear first, within this publication category and among selected papers on the homepage. Leave blank to keep the default order.
        options:
          min: 0
          step: 1
      - name: topics
        label: Research topics
        type: reference
        description: Search and select one or more entries. Linked entries are updated after the site workflow
          runs.
        options:
          collection: research_topics
          multiple: true
          search: title
          value: '{path}'
          label: '{title}'
      - name: doi
        label: Paper link (DOI or publisher URL)
        type: string
      - name: pdf
        label: arXiv PDF URL
        type: string
      - name: code
        label: Code URL
        type: string
      - name: page
        label: Project page URL
        type: string
      - name: data
        label: Dataset URL
        type: string
      - name: bibtex
        label: BibTeX citation
        type: text
        description: Paste the BibTeX entry to enable copying and downloading it.
      - name: notes
        label: Publication note
        type: string
      - name: others
        label: Additional publication note
        type: string
      - name: selected
        label: Show on the homepage
        type: boolean
        default: false
      - name: image
        label: Homepage figure
        type: image
        options:
          media: images
      - name: image_alt
        label: Homepage figure description for screen readers
        type: string
      - name: summary
        label: Homepage summary
        type: text
      - name: conference_short
        label: Venue abbreviation
        type: string
      - name: scholar_id
        label: Google Scholar article ID
        type: string
      - name: order
        label: Default display order
        type: number
        hidden: true
        options: *id001
    # BEGIN GENERATED PAPER VIEWS
    - name: first_author_journals
      label: First-Author Journals (15)
      type: collection
      path: _papers
      filename: *papers_filename
      format: yaml-frontmatter
      subfolders: false
      operations: *papers_operations
      view: *papers_view
      fields: *papers_fields
      exclude:
      - attention-enhanced-channel-estimation-for-6g-mimo-in-unifying-far-field-and-near-field.md
      - codebook-design-for-holographic-mimo-near-field-prospects-and-road-to-standardization.md
      - exploiting-structured-sparsity-in-near-field-from-the-perspective-of-decomposition.md
      - fast-and-robust-channel-estimation-for-hmimo-a-graph-based-wavenumber-domain-approach.md
      - holographic-channel-clustered-sparsity.md
      - learning-based-joint-beamforming-and-antenna-movement-design-for-movable-antenna-systems.md
      - metasurface-router-for-near-field-multi-user-low-interference-access-driven-by-structured-wave.md
      - near-field-sparse-channel-estimation-for-extremely-large-scale-ris-aided-wireless-communications.md
      - near-field-triple-parametric-estimation.md
      - reconfigurable-intelligent-surface-deployment-for-blind-zone-improvement-in-mmwave-wireless-networks.md
      - ris-electromagnetic-joint-model.md
      - ris-uav-secure-transmission.md
      - ris-wireless-beacon-estimation.md
      - two-timescale-beamforming-optimization-for-downlink-multi-user-holographic-mimo-surfaces.md
      - uav-trajectory-resource-allocation.md
      - unified-near-far-paradigm.md
      - wavenumber-domain-near-field-channel-estimation-beyond-the-fresnel-bound.md
      - wavenumber-domain-sparse-channel-estimation-in-holographic-mimo.md
    - name: first_author_conferences
      label: First-Author Conferences (4)
      type: collection
      path: _papers
      filename: *papers_filename
      format: yaml-frontmatter
      subfolders: false
      operations: *papers_operations
      view: *papers_view
      fields: *papers_fields
      exclude:
      - active-ris-robust-beamforming.md
      - angular-distance-estimation.md
      - attention-enhanced-channel-estimation-for-6g-mimo-in-unifying-far-field-and-near-field.md
      - exploiting-structured-sparsity-in-near-field-from-the-perspective-of-decomposition.md
      - fast-and-robust-channel-estimation-for-hmimo-a-graph-based-wavenumber-domain-approach.md
      - harnessing-rydberg-receivers.md
      - high-mobility-millimeter-wave.md
      - holographic-channel-clustered-sparsity.md
      - holographic-mimo-systems.md
      - learning-based-joint-beamforming-and-antenna-movement-design-for-movable-antenna-systems.md
      - metasurface-router-for-near-field-multi-user-low-interference-access-driven-by-structured-wave.md
      - near-field-triple-parametric-estimation.md
      - network-slicing-vehicular.md
      - polarization-aware-doa.md
      - qos-driven-spectrum-sharing.md
      - reconfigurable-intelligent-surface-deployment-for-blind-zone-improvement-in-mmwave-wireless-networks.md
      - ris-electromagnetic-joint-model.md
      - ris-resource-allocation.md
      - ris-uav-secure-transmission.md
      - ris-vehicle-platoons.md
      - ris-vehicular-networks.md
      - ris-wireless-beacon-estimation.md
      - robust-transmission-statistical-csi.md
      - two-timescale-beamforming-optimization-for-downlink-multi-user-holographic-mimo-surfaces.md
      - uav-trajectory-resource-allocation.md
      - unified-holographic-mimo.md
      - unified-near-far-paradigm.md
      - unifying-far-near-field.md
      - wideband-quantum-transduction.md
    - name: coauthor_papers
      label: Co-Author Papers (14)
      type: collection
      path: _papers
      filename: *papers_filename
      format: yaml-frontmatter
      subfolders: false
      operations: *papers_operations
      view: *papers_view
      fields: *papers_fields
      exclude:
      - active-ris-robust-beamforming.md
      - angular-distance-estimation.md
      - codebook-design-for-holographic-mimo-near-field-prospects-and-road-to-standardization.md
      - harnessing-rydberg-receivers.md
      - high-mobility-millimeter-wave.md
      - holographic-mimo-systems.md
      - near-field-sparse-channel-estimation-for-extremely-large-scale-ris-aided-wireless-communications.md
      - network-slicing-vehicular.md
      - polarization-aware-doa.md
      - qos-driven-spectrum-sharing.md
      - ris-resource-allocation.md
      - ris-vehicle-platoons.md
      - ris-vehicular-networks.md
      - robust-transmission-statistical-csi.md
      - unified-holographic-mimo.md
      - unifying-far-near-field.md
      - wavenumber-domain-near-field-channel-estimation-beyond-the-fresnel-bound.md
      - wavenumber-domain-sparse-channel-estimation-in-holographic-mimo.md
      - wideband-quantum-transduction.md
    # END GENERATED PAPER VIEWS
  - name: publications_page
    label: Page settings
    type: file
    path: _data/publications.yml
    format: yaml
    fields:
    - name: heading
      label: Page heading
      type: string
      required: true
    - name: description
      label: Search result description
      type: text
    - name: first_heading
      label: First-author section heading
      type: string
      required: true
    - name: journal_heading
      label: Journal section heading
      type: string
      required: true
    - name: conference_heading
      label: Conference section heading
      type: string
      required: true
    - name: other_heading
      label: Non-first-author section heading
      type: string
      required: true
- name: projects
  label: Projects
  type: file
  path: _data/projects.yml
  format: yaml
  fields:
  - name: heading
    label: Page heading
    type: string
    required: true
  - name: description
    label: Search result description
    type: text
  - name: items
    label: Projects
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{fields.title}'
    fields:
    - name: title
      label: Project name
      type: string
      required: true
    - name: role
      label: Role
      type: string
    - name: dates
      label: Dates
      type: string
    - name: description
      label: Project description
      type: rich-text
      options:
        format: markdown
    - name: link_url
      label: Project link
      type: string
    - name: link_label
      label: Link text
      type: string
- name: honors
  label: Honors
  type: file
  path: _data/honors.yml
  format: yaml
  fields:
  - name: heading
    label: Page heading
    type: string
    required: true
  - name: description
    label: Search result description
    type: text
  - name: items
    label: Honors and awards
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{fields.date} · {fields.title}'
    fields:
    - name: title
      label: Award or honor
      type: string
      required: true
    - name: date
      label: Year or dates
      type: string
      required: true
- name: services
  label: Professional services
  type: file
  path: _data/services.yml
  format: yaml
  fields:
  - name: heading
    label: Page heading
    type: string
    required: true
  - name: description
    label: Search result description
    type: text
  - name: sections
    label: Service sections
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{fields.title}'
    fields:
    - name: title
      label: Section heading
      type: string
      required: true
    - name: id
      label: Link ID
      type: string
      description: Keep the link ID of an existing section.
      required: true
      pattern:
        regex: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        message: Use lowercase letters, numbers, and hyphens.
    - name: body
      label: Service details
      type: rich-text
      required: true
      options:
        format: markdown
- name: news
  label: News
  type: file
  path: _data/news.yml
  format: yaml
  fields:
  - name: heading
    label: Page heading
    type: string
    required: true
  - name: description
    label: Search result description
    type: text
  - name: items
    label: News items
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{fields.month} · {fields.title}'
    fields:
    - name: title
      label: Headline
      type: string
      required: true
    - name: month
      label: Month
      type: string
      description: Enter as YYYY-MM, for example 2026-11.
      required: true
      pattern:
        regex: ^\d{4}-(0[1-9]|1[0-2])$
        message: Use YYYY-MM, for example 2026-11.
    - name: description
      label: News description
      type: text
    - name: deadline
      label: Submission deadline
      type: string
    - name: url
      label: Link URL
      type: string
    - name: link_label
      label: Link text
      type: string
- name: navigation
  label: Navigation
  type: file
  path: _data/navigation.yml
  format: yaml
  fields:
  - name: main
    label: Main menu
    type: object
    description: Drag items to change their order on the website.
    list:
      collapsible:
        collapsed: true
        summary: '{fields.title}'
    fields:
    - name: title
      label: Menu label
      type: string
      required: true
    - name: url
      label: Link
      type: string
      required: true
- name: cv_sections
  label: CV reader
  type: file
  path: _data/cv_sections.yml
  format: yaml
  fields:
  - name: heading
    label: Page heading
    type: string
    required: true
  - name: description
    label: Search result description
    type: text
  - name: sections
    label: PDF sections
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{fields.title}'
    fields:
    - name: title
      label: Section label
      type: string
      required: true
    - name: heading
      label: Heading in the PDF
      type: string
      description: Use text from the PDF so the reader can find it.
      required: true
