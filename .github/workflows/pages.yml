name: Deploy academic homepage

on:
  push:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update Google Scholar statistics"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync_research_links:
    if: >-
      (github.event_name != 'workflow_run' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.sync.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Sync research links and publication views
        id: sync
        env:
          SITE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 -m venv "$RUNNER_TEMP/research-link-tools"
          python="$RUNNER_TEMP/research-link-tools/bin/python"
          "$python" -m pip install --disable-pip-version-check PyYAML==6.0.3
          for attempt in 1 2 3; do
            git fetch --no-tags origin "$SITE_BRANCH"
            git checkout --detach FETCH_HEAD
            "$python" scripts/sync_research_links.py
            "$python" scripts/update_paper_views.py
            git add -u
            if git diff --cached --quiet; then
              echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Sync research links and publication views'
            if git push origin "HEAD:refs/heads/$SITE_BRANCH"; then
              echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          exit 1

  build:
    needs: sync_research_links
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync_research_links.outputs.revision }}
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Set repository-specific URLs
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASEURL: ${{ steps.pages.outputs.base_path }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          path = pathlib.Path('_config.yml')
          config = path.read_text()
          for key, value in {'url': os.environ['SITE_URL'], 'baseurl': os.environ['SITE_BASEURL']}.items():
              config = re.sub(rf'^{key}:.*$', lambda _: key + ': ' + json.dumps(value), config, flags=re.M)
          path.write_text(config)
          PY
      - name: Build site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          build_revision: ${{ needs.sync_research_links.outputs.revision }}
      - name: Upload site
        uses: actions/upload-pages-artifact@v4

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
