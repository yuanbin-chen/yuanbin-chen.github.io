    body: |+
      ### Lead Guest Editor

      - **IEEE Wireless Communications**. [Atomic-to-Network: Quantum Radio Front-Ends for 6G Wireless Communications and Sensing](https://www.comsoc.org/publications/magazines/ieee-wireless-communications/cfp/atomic-network-quantum-radio-front-ends-6g-wireless-communications-and-sensing).
      - **IEEE Communications Magazine**. [The Upper Mid-Band (FR3) for 6G: Technologies, Systems, and Deployment](https://www.comsoc.org/publications/magazines/ieee-communications-magazine/cfp/upper-mid-band-fr3-6g-technologies-systems-and-deployment).
      - **Space: Science & Technology**. [Atomic-to-Space: Quantum Sensors for Spaceborne Communications and Sensing](https://spj.science.org/page/space/si/atomic-to-space).

