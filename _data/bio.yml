heading: Biography
description: Biography, academic appointments, awards, and editorial service of Yuanbin Chen.
body: 'Yuanbin Chen [M] ([yuanbin.chen@ntu.edu.sg](mailto:yuanbin.chen@ntu.edu.sg)) is a Research Fellow with
  the School of Electrical and Electronic Engineering, Nanyang Technological University (NTU), Singapore. He
  received the B.S. degree in Communications Engineering from Beijing Jiaotong University, Beijing, China,
  in 2019, and the Ph.D. degree in Information and Communication Systems from Beijing University of Posts and
  Telecommunications (BUPT), Beijing, China, in 2024. He graduated with honors from both institutions.


  He has been recognized among the Stanford/Elsevier World''s Top 2% Scientists since 2024. He received the
  Excellent Ph.D. Dissertation Award from the Chinese Institute of Electronics Education Society (2025), the
  IEEE IWCMC Best Paper Award (2025), and the IEEE GLOBECOM Best Workshop Paper Award (2023). He has served
  as the Lead Guest Editor for special issues of *IEEE Wireless Communications*, *IEEE Communications Magazine*,
  and *Space: Science & Technology*. He has also organized and chaired workshops and tutorials at flagship
  IEEE conferences. His current research interests include quantum sensing, Rydberg atomic receivers, and advanced
  MIMO technologies for 6G wireless communications.'
education_heading: Education
