heading: Research
description: Research on quantum sensing, 6G near-field communications, XL-MIMO,
  reconfigurable intelligent surfaces, and V2X and UAV networks.
topics:
  - title: Quantum Sensing (Rydberg Atomic Receivers)
    id: quantum-rf
    body: >-
      I study how the response of a Rydberg atomic ensemble can be used to
      recover a radio-frequency signal. My work connects the atomic response to
      receiver bandwidth, noise, and sensitivity, and examines how the vector
      response of a vapor cell can support polarization and direction-of-arrival
      estimation.


      A current focus is wideband RF-to-optical transduction through six-wave
      mixing, including how the auxiliary fields affect the receiver’s frequency
      response.
    image: /assets/img/six-wave-mixing.webp
    image_alt: Six-level Rydberg transition diagram and RF-to-optical receiver setup
    caption: Six-wave-mixing receiver and its atomic transitions. [Chen, Yuen, and
      See, IEEE JSAC (2026)](https://doi.org/10.1109/JSAC.2026.3716945).
    related_papers:
      - label: Wideband Quantum Transduction for Rydberg Atomic Receivers Using Six-Wave
          Mixing
        url: /publications/#wideband-quantum-transduction
      - label: Polarization-Aware DoA Detection Relying on a Single Rydberg Atomic
          Receiver
        url: /publications/#polarization-aware-doa
      - label: "Harnessing Rydberg Atomic Receivers: From Quantum Physics to Wireless
          Communications"
        url: /publications/#harnessing-rydberg-receivers
  - title: 6G Near-Field Communications
    id: near-field
    body: Wavefront curvature becomes significant as antenna apertures grow. I study
      how near- and far-field propagation can be represented in a common
      wavenumber domain, and how that representation informs channel models and
      transmission design across link distances.
    image: /assets/img/holographic-wavenumber.webp
    related_papers:
      - label: Unifying Far-Field and Near-Field Wireless Communications in 6G MIMO
        url: /publications/#unifying-far-near-field
  - title: XL-MIMO / Holographic MIMO / Movable Antennas
    id: new-mimo
    body: For electrically large and densely sampled apertures, I study how to use
      wavenumber, angle, and distance information to recover the channel. One
      focus is how to model structure in the channel and exploit it to reduce
      estimation overhead.
    image_alt: Diagrams comparing electromagnetic fields with different wavenumbers
    caption: Electromagnetic fields characterized by different wavenumbers. [Chen et
      al., IEEE Communications Magazine
      (2025)](https://doi.org/10.1109/MCOM.001.2300845).
    related_papers:
      - label: "Unified Far-Field and Near-Field in Holographic MIMO: A
          Wavenumber-Domain Perspective"
        url: /publications/#unified-holographic-mimo
      - label: Angular-Distance Based Channel Estimation for Holographic MIMO
        url: /publications/#angular-distance-estimation
  - title: Reconfigurable Intelligent Surfaces (RIS)
    id: reconfigurable-intelligent-surfaces
    body: I study RIS-assisted propagation and channel estimation, as well as robust
      beamforming and resource allocation when the channel is uncertain or the
      terminals are moving rapidly.
    related_papers:
      - label: Near-Field Sparse Channel Estimation for Extremely Large-Scale RIS-Aided
          Wireless Communications
        url: /publications/#extremely-large-ris-estimation
      - label: Robust Beamforming for Active Reconfigurable Intelligent Omni-Surface in
          Vehicular Communications
        url: /publications/#active-ris-robust-beamforming
  - title: V2X / UAV Networks
    id: v2x-uav-networks
    body: My work on vehicular and aerial networks examines how mobility affects
      channel tracking, spectrum sharing, and reliable transmission. It also
      covers joint trajectory and resource optimization for UAV-assisted
      networks.
    related_papers:
      - label: "Location Tracking for Reconfigurable Intelligent Surfaces Aided Vehicle
          Platoons: Diverse Sparsities Inspired Approaches"
        url: /publications/#ris-vehicle-platoons
      - label: Joint Resource Allocation and UAV Trajectory Optimization for
          Space–Air–Ground Internet of Remote Things Networks
        url: /publications/#uav-trajectory-resource-allocation
