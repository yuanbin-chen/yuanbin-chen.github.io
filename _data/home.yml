introduction: I am a Postdoctoral Research Fellow at School of Electrical and Electronic Engineering (EEE), Nanyang
  Technological University (NTU), Singapore, supervised by [Prof. Chau Yuen](https://blogs.ntu.edu.sg/chau-yuen/).
  I received the B.S. degree from Beijing Jiaotong University, Beijing, China, in 2019, and the Ph.D. degree from
  Beijing University of Posts and Telecommunications (BUPT), Beijing, China, in 2024. I graduated with honors from
  both institutions.
