introduction: I am a Postdoctoral Research Fellow at School of Electrical and
  Electronic Engineering (EEE), Nanyang Technological University (NTU),
  Singapore, supervised by [Prof. Chau
  Yuen](https://blogs.ntu.edu.sg/chau-yuen/). I received the B.S. degree from
  Beijing Jiaotong University (BJTU), Beijing, China, in 2019, and the Ph.D.
  degree (Hons.) from Beijing University of Posts and Telecommunications (BUPT),
  Beijing, China, in 2024.
distinction: Stanford/Elsevier World's Top 2% Scientists (2024 - current)
